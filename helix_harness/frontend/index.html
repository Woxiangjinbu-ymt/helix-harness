<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0d11" />
    <title>Helix Harness · Coding Workspace</title>
    <link rel="icon" type="image/svg+xml" href="/helix.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("helix.theme");
          if (t !== "light" && t !== "dark") {
            t = "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "light" ? "#f6f7f9" : "#0a0d11");
          var l = localStorage.getItem("helix.locale");
          if (l === "zh" || l === "en") {
            document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
