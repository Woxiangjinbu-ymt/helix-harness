[project]
name = "helix-harness"
version = "1.0.0"
description = "Local Coding Workspace and Self-Improving RSI Center"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mtcode==0.2.0",
    "fastapi==0.165.0",
    "uvicorn==0.46.0",
    "pillow>=11",
]

[project.scripts]
helix-harness = "helix_harness.__main__:main"

[tool.uv.sources]
mtcode = { path = "vendor/mtcode-runtime", editable = true }

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "playwright==1.65.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["helix_harness/tests", "vendor/mtcode-runtime/tests"]

[tool.hatch.build.targets.wheel]
packages = ["helix_harness"]
exclude = ["/helix_harness/frontend", "/helix_harness/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
